name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to create a GitHub Release on tag pushes

jobs:
  build:
    # Merging a release pull request into main also starts this build on the release tag
    # (release-publish.yml), which runs the same tests, so skip the duplicate push build.
    # Matches the merge commit ("Merge pull request #N from owner/release/vX.Y.Z") and a squash
    # merge ("Release vX.Y.Z (#N)", the pull request title).
    if: >-
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        (contains(github.event.head_commit.message, '/release/v') ||
         startsWith(github.event.head_commit.message, 'Release v')))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh --universal

      - name: Zip
        id: zip
        run: |
          ZIP="DBGram-${{ steps.version.outputs.version }}.zip"
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --keepParent build/DBGram.app "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBGram-${{ steps.version.outputs.version }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.x.y and suffixed tags (v1.0.0-beta.1) are pre-releases: shown with a badge, never "Latest".
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.zip }}" \
            --title "DBGram $GITHUB_REF_NAME" --generate-notes "${FLAGS[@]}"
